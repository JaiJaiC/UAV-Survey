<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UAV-Survey drone icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1117"/>
  <!-- arms -->
  <g stroke="url(#g)" stroke-width="3.2" stroke-linecap="round">
    <line x1="20" y1="20" x2="44" y2="44"/>
    <line x1="44" y1="20" x2="20" y2="44"/>
  </g>
  <!-- rotors -->
  <g fill="none" stroke="url(#g)" stroke-width="3">
    <circle cx="17" cy="17" r="6.5"/>
    <circle cx="47" cy="17" r="6.5"/>
    <circle cx="17" cy="47" r="6.5"/>
    <circle cx="47" cy="47" r="6.5"/>
  </g>
  <!-- body -->
  <rect x="25.5" y="25.5" width="13" height="13" rx="4" fill="#f97316"/>
  <rect x="29" y="29" width="6" height="6" rx="1.6" fill="#0f1117" opacity="0.55"/>
</svg>
